name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run audit:unused
      - run: npm run audit:unused -- --production --include files,dependencies,unlisted,unresolved,binaries
      - run: npm test
      - run: npm run test:backend
      - run: npm run lint:backend
      - run: npm run build
      - run: npm install --global firebase-tools@15.15.0
      - run: npm run test:payment-rules
