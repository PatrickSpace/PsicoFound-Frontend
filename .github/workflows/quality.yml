name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run audit:unused
      - run: npm run audit:unused -- --production --include files,dependencies,unlisted,unresolved,binaries
      - run: npm test
      - run: npm run test:backend
      - run: npm run lint:backend
      - run: npm run build
      - run: npm install --global firebase-tools@15.15.0
      # Downloads precede isolation; the suite itself cannot reach these services.
      - run: firebase setup:emulators:firestore
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=moderate
      - run: npm --prefix functions audit --audit-level=moderate
      - name: Patient, professional, accounts, survey, payments and Lima (loopback only)
        run: npm run test:agenda
        env:
          PILOT_VALIDATION: "true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-validation
          path: |
            test-results/
            playwright-report/
          retention-days: 7
