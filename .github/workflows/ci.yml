name: Validate Lurems

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix functions test
      - run: npm run test:rules
      - run: npm run test:payments:emulator
      - run: npm run build
